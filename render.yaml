# Render Blueprint: New > Blueprint > pick this repository.
# The database is hosted PostgreSQL (Neon): paste its connection string into DATABASE_URL when Render asks.
# Because the data lives in Neon, restarts and sleeping lose nothing. Demo data loads only into an EMPTY database
# (ALIFARIS_DEMO=1); set ALIFARIS_DEMO=0 once real data goes in. The free plan still sleeps after 15 minutes idle.
# Without DATABASE_URL the app falls back to SQLite on the (temporary) disk.
services:
  - type: web
    name: alifaris-demo
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: ALIFARIS_DEMO
        value: "1"
      - key: ALIFARIS_DEMO_PASSWORD
        generateValue: true
      - key: ALIFARIS_SITE_CODE
        value: MAIN
