{% extends "launcher/base.html" %}
{% load static %}
{% block title %}Log in - Alifaris ERP{% endblock %}
{% block bodyclass %}launcher login{% endblock %}
{% block content %}
<main class="login-box">
  <div class="plate"><img src="{% static 'launcher/brand/logo-640.png' %}" alt="Alifaris Auto Spare"></div>
  <h1>Sign in</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.errors %}<p class="err">Wrong username or password.</p>{% endif %}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Log in</button>
  </form>
</main>
{% endblock %}
